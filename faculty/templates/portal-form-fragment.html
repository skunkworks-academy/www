<script defer src="https://www.skunkworksacademy.com/assets/academy-navigation.js?v=2026.07.04" data-skunkworks-global-nav="v3"></script>
<!-- Skunkworks Academy portal/login form fragment. Place inside the shared page shell. -->
<section class="sk-login-layout">
  <form class="sk-form sk-form-card" data-sk-validate>
    <p class="sk-eyebrow">Portal Access</p>
    <h1>Sign in</h1>

    <div class="sk-field">
      <label class="sk-label" for="email">Email address</label>
      <input class="sk-input" id="email" name="email" type="email" autocomplete="email" required />
      <p class="sk-help-text">Use your Skunkworks Academy or invited learner email address.</p>
    </div>

    <div class="sk-field">
      <label class="sk-label" for="password">Password</label>
      <input class="sk-input" id="password" name="password" type="password" autocomplete="current-password" required />
    </div>

    <button class="sk-button" type="submit">Continue</button>
  </form>
</section>
