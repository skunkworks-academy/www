name: One-time brand term remediation

on:
  push:
    paths:
      - .github/workflows/brand-term-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace disallowed homepage wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Skunkworks Academy | Unified Learning Ecosystem': 'Skunkworks Academy | Unified Learning Platform',
              'One learning ecosystem. Every Academy domain aligned.': 'One Academy. Every domain aligned.',
              'Unified learning ecosystem': 'Unified learning platform',
              'unified learning ecosystem': 'unified learning platform',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if 'Ecosystem' in text or 'ecosystem' in text:
              raise SystemExit('Disallowed term still present in index.html')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/brand-term-remediation.yml

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/brand-term-remediation.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "fix: replace disallowed homepage brand wording"
          git push
