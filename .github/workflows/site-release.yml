name: Site release

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'docs/accessibility-contrast.md'
      - 'package.json'
      - 'CNAME'
      - '.github/workflows/site-release.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and audit site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run build, content and WCAG contrast validation
        run: npm run build
      - name: Validate Academy platform contract
        run: node scripts/validate-platform-contract.mjs
      - name: Verify custom domain file
        run: test "$(tr -d '\r\n' < CNAME)" = "skunkworksacademy.com"
      - name: Verify canonical loader is CORS-safe
        run: |
          if grep -Eq 'script\.crossOrigin[[:space:]]*=' assets/academy-navigation.js; then
            echo 'Canonical loader must not force CORS mode on shared classic scripts.'
            exit 1
          fi
          if grep -Eqi 'setAttribute\([^)]*crossorigin' assets/academy-navigation.js; then
            echo 'Canonical loader must not add a crossorigin attribute to shared classic scripts.'
            exit 1
          fi
          grep -q 'isApexAlias' assets/academy-navigation.js
          grep -q 'isLocalPreview' assets/academy-navigation.js
          grep -q 'window.location.origin' assets/academy-navigation.js
          grep -q 'installBrandTheme' assets/academy-navigation.js
          grep -q 'bodyBackground: "theme-owned"' assets/academy-navigation.js

  lighthouse:
    name: Lighthouse local production audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare branch-local Lighthouse fixture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(
            /https:\/\/(?:www\.)?skunkworksacademy\.com\/(?=(?:assets|images)\/)/g,
            'http://127.0.0.1:4173/'
          );
          fs.writeFileSync('lighthouse-local.html', html);
          NODE
          grep -q '<link rel="canonical" href="https://www.skunkworksacademy.com/' lighthouse-local.html
          if grep -Eq 'https://(www\.)?skunkworksacademy\.com/(assets|images)/' lighthouse-local.html; then
            echo 'Lighthouse fixture still references production Academy assets.'
            exit 1
          fi
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skw-http.log 2>&1 &
          echo $! > /tmp/skw-http.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-http.log
          exit 1
      - name: Verify Lighthouse uses checked-out shell and accessibility assets
        run: |
          curl --fail --silent http://127.0.0.1:4173/assets/academy-navigation.js | grep -q 'isLocalPreview'
          curl --fail --silent http://127.0.0.1:4173/assets/academy-navigation.js | grep -q 'installBrandTheme'
          curl --fail --silent http://127.0.0.1:4173/assets/academy-brand-theme.css | grep -q -- '--swa-theme-contract-version'
          curl --fail --silent http://127.0.0.1:4173/assets/skunkworks-ui.js | grep -q 'logo-white.svg'
          curl --fail --silent http://127.0.0.1:4173/assets/skunkworks-accessibility.css | grep -q 'accessibility contrast contract'
      - name: Collect Lighthouse samples
        run: |
          set -euo pipefail
          # Keep the local first-party performance gate deterministic. External
          # font CDN timing is not controlled by this repository and was causing
          # large synthetic CLS variance between otherwise identical runs.
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/lighthouse-local.html \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --blocked-url-patterns='*googlesyndication.com*' \
              --blocked-url-patterns='*fonts.googleapis.com*' \
              --blocked-url-patterns='*fonts.gstatic.com*' \
              --output=json \
              --output-path="./lighthouse-report-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet
          done
      - name: Audit rendered light and dark colour contrast
        run: |
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/tests/accessibility-contrast.html \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-contrast.json \
            --only-audits=color-contrast \
            --quiet
          node - <<'NODE'
          const report = require('./lighthouse-contrast.json');
          const audit = report.audits['color-contrast'];
          if (!audit || audit.score !== 1) {
            console.error('Rendered WCAG colour-contrast audit failed.');
            for (const item of audit?.details?.items || []) {
              console.error(item.node?.selector || item.node?.snippet || JSON.stringify(item));
            }
            process.exit(1);
          }
          console.log('Rendered light/dark colour-contrast audit passed.');
          NODE
      - name: Assert median Lighthouse scores
        run: node scripts/assert-lighthouse.mjs lighthouse-report-1.json lighthouse-report-2.json lighthouse-report-3.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: |
            lighthouse-report-*.json
            lighthouse-contrast.json
          if-no-files-found: error
          retention-days: 30

  art101-browser:
    name: ART-101 interaction and hydration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/course-catalog
          ref: main
          path: .course-catalog
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build course catalogue
        working-directory: .course-catalog
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Mount ART-101 course and route
        run: |
          node scripts/mount-subsystem.mjs --source .course-catalog/build --mount courses --landing courses.html --manifest course-manifest.json --asset-dirs assets,img,downloads
          test -s courses/professional-articulation.html
          mkdir -p courses/professional-articulation
          cp courses/professional-articulation.html courses/professional-articulation/index.html
          # Compatibility for Docusaurus lazy chunks with root webpack publicPath.
          # Retain canonical isolated /courses/assets and expose hashed chunks
          # at /assets/{js,css} until upstream build uses a scoped base URL.
          for dir in js css; do
            if test -d "courses/assets/$dir"; then
              mkdir -p "assets/$dir"
              cp -a "courses/assets/$dir/." "assets/$dir/"
            fi
          done

      - name: Test real browser controls
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/art101-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node scripts/test-art101-interactions.mjs

  beginner_courses:
    name: Validate Academy-domain beginner course composition
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Academy website
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout source courseware
        uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/digital-platform-courses
          ref: main
          path: .digital-platform-courses
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate and compile Docusaurus against Academy domain
        working-directory: .digital-platform-courses
        env:
          SKW_CANONICAL_SITE_URL: https://www.skunkworksacademy.com
        run: |
          npm ci --no-audit --no-fund
          npm run validate:beginner
          npm run typecheck
          npm run build
      - name: Compose and verify course routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mount-digital-courses.mjs
          python3 -m http.server 4178 --bind 127.0.0.1 > /tmp/skw-beginner-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..25}; do
            if curl --fail --silent http://127.0.0.1:4178/digital-platform-courses/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-composed-site.mjs \
            --base-url http://127.0.0.1:4178/ \
            --routes /beginner/,/beginner/ai/,/beginner/cyber/,/beginner/it-support/,/beginner/microsoft-productivity/,/beginner/cloud/,/digital-platform-courses/,/digital-platform-courses/beginner/,/digital-platform-courses/beginner/ai/,/digital-platform-courses/beginner/cyber/,/digital-platform-courses/beginner/it-support/,/digital-platform-courses/beginner/microsoft-productivity/,/digital-platform-courses/beginner/cloud/

  deploy:
    name: Deploy GitHub Pages
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.art101-browser.result == 'success' &&
      needs.beginner_courses.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [validate, lighthouse, art101-browser, beginner_courses]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Academy site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout canonical course catalog source
        uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/course-catalog
          ref: main
          path: .course-catalog
          persist-credentials: false

      - name: Checkout beginner course source
        uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/digital-platform-courses
          ref: main
          path: .digital-platform-courses
          persist-credentials: false

      - name: Set up Node.js for course catalog
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build canonical course catalog
        working-directory: .course-catalog
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Mount course-catalog build with isolated subsystem assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/mount-subsystem.mjs \
            --source .course-catalog/build \
            --mount courses \
            --landing courses.html \
            --manifest course-manifest.json \
            --asset-dirs assets,img,downloads

          # The Docusaurus runtime contains a root /assets/ webpack public path.
          # HTML asset tags are rewritten by mount-subsystem, but dynamic JS
          # chunks must also resolve under the isolated /courses/assets mount.
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'courses/assets';
          let count = 0;
          function scan(dir) {
            for (const item of fs.readdirSync(dir, {withFileTypes:true})) {
              const full = path.join(dir,item.name);
              if (item.isDirectory()) scan(full);
              else if (item.isFile() && full.endsWith('.js')) {
                const source = fs.readFileSync(full,'utf8');
                const updated = source.replaceAll('"/assets/', '"/courses/assets/').replaceAll('.p="/"','.p="/courses/"');
                if (updated !== source) {fs.writeFileSync(full,updated);count++;}
              }
            }
          }
          scan(root);
          console.log('Rebased dynamic webpack asset paths in',count,'bundles');
          if (count === 0) throw Error('No webpack asset paths rewritten; inspect generated publicPath');
          NODE

          # Compatibility for Docusaurus lazy chunks with root webpack publicPath.
          # Retain canonical isolated /courses/assets and expose hashed chunks
          # at /assets/{js,css} until upstream build uses a scoped base URL.
          for dir in js css; do
            if test -d "courses/assets/$dir"; then
              mkdir -p "assets/$dir"
              cp -a "courses/assets/$dir/." "assets/$dir/"
            fi
          done
          # Docusaurus emits /courses/professional-articulation.html while
          # users navigate to the extensionless public URL. GitHub Pages and
          # local Python hosting must both resolve the direct route.
          test -s courses/professional-articulation.html
          mkdir -p courses/professional-articulation
          cp courses/professional-articulation.html courses/professional-articulation/index.html
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          function scan(dir) {
            for (const item of fs.readdirSync(dir,{withFileTypes:true})) {
              const full=path.join(dir,item.name);
              if(item.isDirectory()) scan(full);
              else if(item.isFile()&&full.endsWith('.js')){
                const source=fs.readFileSync(full,'utf8');
                const updated=source.replaceAll('"/assets/', '"/courses/assets/').replaceAll('.p="/"','.p="/courses/"');
                if(updated!==source) fs.writeFileSync(full,updated);
              }
            }
          }
          scan('courses/assets');
          NODE

          test -s courses/professional-articulation/index.html

          test -f courses/index.html
          test -d courses/assets
          grep -q 'https://www.skunkworksacademy.com/courses' courses/index.html
          grep -R -q '/courses/assets/' courses --include='*.html'

          if grep -R -q 'catalog.skunkworksacademy.com' courses --include='*.html' 2>/dev/null \
            || grep -q 'catalog.skunkworksacademy.com' courses.html course-manifest.json 2>/dev/null; then
            echo 'Legacy catalogue hostname leaked into the /courses deployment.'
            exit 1
          fi

          rm -rf .course-catalog
          echo 'Mounted skunkworks-academy/course-catalog at /courses using the generic isolated subsystem contract.'

      - name: Verify ART-101 controls respond in a real browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/art101-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:4175/courses/professional-articulation >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-art101-interactions.mjs

      - name: Build and mount five beginner courses on Academy origin
        shell: bash
        run: |
          set -euo pipefail
          (
            cd .digital-platform-courses
            npm ci --no-audit --no-fund
            npm run validate:beginner
            npm run typecheck
            SKW_CANONICAL_SITE_URL=https://www.skunkworksacademy.com npm run build
          )
          node scripts/mount-digital-courses.mjs
          rm -rf .digital-platform-courses
          echo "Beginner courses mounted at /digital-platform-courses and /beginner/ aliases"

      - name: Browser-test Academy beginner lessons and global chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --legacy-peer-deps playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4179 --bind 127.0.0.1 > /tmp/skw-studio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:4179/digital-platform-courses/beginner/ai/ >/dev/null; then break; fi
            sleep 1
          done
          SKW_STUDIO_TEST_ORIGIN=http://127.0.0.1:4179 node scripts/test-beginner-visual-experience.mjs

      - name: Apply publisher indexing and AdSense policy
        run: npm run publisher:apply

      - name: Normalize and verify Academy global shell on every HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          navigation_source = Path('assets/academy-navigation.js').read_text(encoding='utf-8', errors='ignore')
          version_match = re.search(r'var VERSION = "([^"]+)";', navigation_source)
          revision_match = re.search(r'var REVISION = "([^"]+)";', navigation_source)
          if not version_match or not revision_match:
              raise SystemExit('Unable to resolve current Academy shell VERSION/REVISION from assets/academy-navigation.js')

          version = version_match.group(1)
          revision = revision_match.group(1)
          if version != revision:
              raise SystemExit(f'Academy shell VERSION/REVISION drift: {version} != {revision}')

          accessibility_version = '2026.08.16.1'
          loader = f'<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v={version}&rev={revision}" data-skunkworks-global-nav="v10"></script>'
          accessibility = f'<link rel="stylesheet" href="/assets/skunkworks-accessibility.css?v={accessibility_version}" data-skunkworks-accessibility="wcag-contrast" />'
          shell_tag = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          accessibility_tag = re.compile(r'<link\b[^>]*(?:skunkworks-accessibility\.css|data-skunkworks-accessibility)[^>]*>', re.I)
          pages = []
          fragments = []
          course_pages = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              html = path.read_text(encoding='utf-8', errors='ignore')
              is_document = bool(re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I))
              if not is_document:
                  fragments.append(path)
                  continue

              # The Docusaurus course app owns its React document. The legacy
              # academy-navigation loader mutates HTML and can break hydration.
              # Use the same canonical UI and footer scripts directly instead.
              if 'digital-platform-courses' in path.parts:
                  if 'skunkworks-ui.js' not in html or 'skunkworks-footer.js' not in html:
                      raise SystemExit(f'Missing Academy canonical chrome on course page: {path}')
                  if 'academy-navigation.js' in html:
                      raise SystemExit(f'Legacy shell leaked into Docusaurus course page: {path}')
                  course_pages.append(path)
                  continue

              html = shell_tag.sub('', html)
              html = accessibility_tag.sub('', html)

              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {accessibility}\n  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {accessibility}\n  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')

              path.write_text(html, encoding='utf-8')
              pages.append(path)

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              shell_count = html.count('academy-navigation.js')
              accessibility_count = html.count('skunkworks-accessibility.css')
              if version not in html or revision not in html or 'data-skunkworks-global-nav="v10"' not in html or shell_count == 0:
                  missing.append(f'{path} (shell)')
              if accessibility_version not in html or 'data-skunkworks-accessibility="wcag-contrast"' not in html or accessibility_count == 0:
                  missing.append(f'{path} (accessibility)')
              if shell_count > 1:
                  duplicate.append(f'{path} (shell)')
              if accessibility_count > 1:
                  duplicate.append(f'{path} (accessibility)')

          if missing:
              raise SystemExit('Missing current Academy shell/accessibility contract: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate Academy shell/accessibility assets: ' + ', '.join(duplicate))

          print(f'Normalized Academy global shell {version} / revision {revision} / v10 on {len(pages)} HTML document(s).')
          print(f'Normalized WCAG contrast stylesheet {accessibility_version} on {len(pages)} HTML document(s).')
          print(f'Skipped {len(fragments)} non-document HTML fragment(s).')
          print(f'Preserved {len(course_pages)} Docusaurus course documents without the legacy DOM-mutating shell.')
          PY

      - name: Stage final Pages artifact in _site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.course-catalog/' \
            --exclude='.digital-platform-courses/' \
            --exclude='_site/' \
            --exclude='test-results/' \
            ./ _site/
          node scripts/stamp-platform-contract.mjs academy-platform-contract.json _site/academy-platform-contract.json

      - name: Start final composed _site
        shell: bash
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory _site > /tmp/skw-composed-http.log 2>&1 &
          echo $! > /tmp/skw-composed-http.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-composed-http.log
          exit 1

      - name: Verify final composed routes and referenced CSS/JS
        run: >-
          node scripts/verify-composed-site.mjs
          --base-url http://127.0.0.1:4174/
          --routes /,/courses/,/courses/professional-articulation,/learn/,/ibm/,/microsoft/,/cisco/,/comptia/,/course-registration/,/forms/,/self-paced/,/slides/,/beginner/,/beginner/ai/,/beginner/cyber/,/beginner/it-support/,/beginner/microsoft-productivity/,/beginner/cloud/,/digital-platform-courses/,/digital-platform-courses/beginner/,/digital-platform-courses/beginner/ai/,/digital-platform-courses/beginner/cyber/,/digital-platform-courses/beginner/it-support/,/digital-platform-courses/beginner/microsoft-productivity/,/digital-platform-courses/beginner/cloud/

      - uses: actions/configure-pages@v5

      - name: Install and verify Academy search favicons
        uses: skunkworks-academy/www/.github/actions/search-favicons@070f621875577a66ae43cdffa7e9d20c65efdc71
        with:
          artifact-path: "_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production domain
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout expected production contract
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait for production and verify CORS-safe shell assets and /courses
        shell: bash
        run: |
          set -euo pipefail
          shell_version="$(sed -n 's/.*var VERSION = "\([^"]*\)";.*/\1/p' assets/academy-navigation.js)"
          shell_revision="$(sed -n 's/.*var REVISION = "\([^"]*\)";.*/\1/p' assets/academy-navigation.js)"
          test -n "$shell_version"
          test "$shell_version" = "$shell_revision"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Fail fast on custom-domain TLS problems. Retrying content checks cannot
          # repair an expired certificate and only hides the actual release blocker.
          cert_file="$tmp/www-cert.pem"
          if ! timeout 15 openssl s_client -connect www.skunkworksacademy.com:443 -servername www.skunkworksacademy.com -showcerts </dev/null 2>/dev/null \
            | openssl x509 -outform PEM > "$cert_file"; then
            echo "Unable to retrieve the production TLS certificate for www.skunkworksacademy.com."
            exit 1
          fi
          echo "Production TLS certificate:"
          openssl x509 -in "$cert_file" -noout -subject -issuer -dates
          if ! openssl x509 -in "$cert_file" -checkend 0 -noout; then
            echo "Production TLS certificate is expired. Renew/fix the GitHub Pages custom-domain certificate before release verification can pass."
            exit 1
          fi

          for attempt in {1..30}; do
            cache="ci=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            : > "$tmp/home.html"
            : > "$tmp/courses.html"
            : > "$tmp/shell.js"
            : > "$tmp/theme.css"
            : > "$tmp/ui.js"
            : > "$tmp/footer.js"
            : > "$tmp/accessibility.css"

            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/?shell-rev=${shell_revision}&${cache}" -o "$tmp/home.html" || true
            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/courses?${cache}" -o "$tmp/courses.html" || true
            curl --location --fail --silent --show-error --max-time 20 "https://skunkworksacademy.com/assets/academy-navigation.js?v=${shell_version}&rev=${shell_revision}&${cache}" -o "$tmp/shell.js" || true
            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/assets/academy-brand-theme.css?${cache}" -o "$tmp/theme.css" || true
            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/assets/skunkworks-ui.js?${cache}" -o "$tmp/ui.js" || true
            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/assets/skunkworks-footer.js?${cache}" -o "$tmp/footer.js" || true
            curl --location --fail --silent --show-error --max-time 20 "https://www.skunkworksacademy.com/assets/skunkworks-accessibility.css?${cache}" -o "$tmp/accessibility.css" || true

            if [[ -s "$tmp/home.html" \
              && -s "$tmp/courses.html" \
              && -s "$tmp/shell.js" \
              && -s "$tmp/theme.css" \
              && -s "$tmp/ui.js" \
              && -s "$tmp/footer.js" \
              && -s "$tmp/accessibility.css" ]] \
              && grep -qi '<title>Skunkworks Academy' "$tmp/home.html" \
              && grep -q 'G-NWBW8HWEDR' "$tmp/home.html" \
              && grep -q "rev=${shell_revision}" "$tmp/home.html" \
              && grep -q 'data-skunkworks-accessibility="wcag-contrast"' "$tmp/home.html" \
              && grep -q 'https://www.skunkworksacademy.com/courses' "$tmp/courses.html" \
              && grep -Eqi 'Skunkworks Academy Courses|Course Catalog|Learning Formats and Training Delivery' "$tmp/courses.html" \
              && ! grep -q 'catalog.skunkworksacademy.com' "$tmp/courses.html" \
              && grep -Fq "var VERSION = \"${shell_version}\";" "$tmp/shell.js" \
              && grep -Fq "var REVISION = \"${shell_revision}\";" "$tmp/shell.js" \
              && grep -q 'bodyBackground: "theme-owned"' "$tmp/shell.js" \
              && grep -q 'window.location.origin' "$tmp/shell.js" \
              && ! grep -Eq 'script\.crossOrigin[[:space:]]*=' "$tmp/shell.js" \
              && grep -q -- '--sw-skunk-blue: #1e6bd0' "$tmp/theme.css" \
              && grep -q -- '--sw-signal-orange: #f24208' "$tmp/theme.css" \
              && grep -q 'Skunkworks Academy Global UI' "$tmp/ui.js" \
              && grep -q 'Skunkworks Academy' "$tmp/footer.js" \
              && grep -q 'accessibility contrast contract' "$tmp/accessibility.css"; then
              echo "Production verification succeeded on attempt ${attempt}, including shell ${shell_version} and /courses deployment."
              exit 0
            fi

            echo "Production verification attempt ${attempt}/30 has not converged yet; retrying in 10 seconds."
            sleep 10
          done

          echo "Production verification failed after 30 attempts for shell ${shell_version}: canonical theme/shell/accessibility assets or /courses were not found on the www origin."
          exit 1

      - name: Production representative-route asset smoke gate
        run: >-
          node scripts/verify-composed-site.mjs
          --base-url https://www.skunkworksacademy.com/
          --routes /,/courses/,/courses/professional-articulation,/learn/,/ibm/,/microsoft/,/cisco/,/comptia/,/course-registration/,/forms/,/self-paced/,/slides/,/beginner/,/beginner/ai/,/beginner/cyber/,/beginner/it-support/,/beginner/microsoft-productivity/,/beginner/cloud/,/digital-platform-courses/,/digital-platform-courses/beginner/,/digital-platform-courses/beginner/ai/,/digital-platform-courses/beginner/cyber/,/digital-platform-courses/beginner/it-support/,/digital-platform-courses/beginner/microsoft-productivity/,/digital-platform-courses/beginner/cloud/
