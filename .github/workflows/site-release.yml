name: Site release

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'CNAME'
      - '.github/workflows/site-release.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and audit site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run dependency-free build validation
        run: npm run build
      - name: Verify custom domain file
        run: test "$(tr -d '\r\n' < CNAME)" = "skunkworksacademy.com"

  lighthouse:
    name: Lighthouse local production audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skw-http.log 2>&1 &
          echo $! > /tmp/skw-http.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-http.log
          exit 1
      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-report.json \
            --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const report = require('./lighthouse-report.json');
          const scores = report.categories;
          const thresholds = { performance: 0.70, accessibility: 0.90, 'best-practices': 0.90, seo: 0.90 };
          let failed = false;
          for (const [category, minimum] of Object.entries(thresholds)) {
            const score = scores[category].score;
            console.log(`${category}: ${Math.round(score * 100)}`);
            if (score < minimum) {
              console.error(`${category} is below ${Math.round(minimum * 100)}`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and verify Academy global shell on every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '2026.08.15.1'
          loader = f'<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v={version}" data-skunkworks-global-nav="v10"></script>'
          shell_tag = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          pages = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              html = path.read_text(encoding='utf-8', errors='ignore')
              html = shell_tag.sub('', html)

              if '</head>' in html:
                  html = html.replace('</head>', f'  {loader}\n</head>', 1)
              elif '</body>' in html:
                  html = html.replace('</body>', f'  {loader}\n</body>', 1)
              else:
                  raise SystemExit(f'Cannot inject Academy global shell into {path}: no closing head/body tag')

              path.write_text(html, encoding='utf-8')
              pages.append(path)

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              count = html.count('academy-navigation.js')
              if version not in html or 'data-skunkworks-global-nav="v10"' not in html or count == 0:
                  missing.append(str(path))
              if count > 1:
                  duplicate.append(str(path))

          if missing:
              raise SystemExit('Missing current Academy global shell: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate Academy global shell loaders: ' + ', '.join(duplicate))

          print(f'Normalized Academy global shell {version} / v10 on {len(pages)} HTML page(s).')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production domain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify HTML
        run: |
          for attempt in {1..30}; do
            response="$(curl --location --fail --silent --show-error --max-time 20 https://www.skunkworksacademy.com/ || true)"
            shell="$(curl --location --fail --silent --show-error --max-time 20 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1' || true)"
            if printf '%s' "$response" | grep -qi '<title>Skunkworks Academy' && printf '%s' "$response" | grep -qi 'academy-navigation.js' && printf '%s' "$shell" | grep -q 'skunkworks-ui.js' && printf '%s' "$shell" | grep -q 'skunkworks-footer.js' && printf '%s' "$shell" | grep -q 'skunkworks-design-system.css'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production verification failed: expected page and canonical UI/footer/design-system markers were not found.'
          exit 1
