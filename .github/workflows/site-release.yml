name: Site release

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'CNAME'
      - '.github/workflows/site-release.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and audit site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run dependency-free build validation
        run: npm run build
      - name: Verify custom domain file
        run: test "$(tr -d '\r\n' < CNAME)" = "skunkworksacademy.com"
      - name: Verify canonical loader is CORS-safe
        run: |
          if grep -Eq 'script\.crossOrigin\s*=|setAttribute\(["'"']crossorigin' assets/academy-navigation.js; then
            echo 'Canonical loader must not force CORS mode on shared classic scripts.'
            exit 1
          fi
          grep -q 'isApexAlias' assets/academy-navigation.js
          grep -q 'window.location.origin' assets/academy-navigation.js

  lighthouse:
    name: Lighthouse local production audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skw-http.log 2>&1 &
          echo $! > /tmp/skw-http.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-http.log
          exit 1
      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-report.json \
            --only-categories=performance,accessibility,best-practices,seo
          node - <<'NODE'
          const report = require('./lighthouse-report.json');
          const scores = report.categories;
          const thresholds = { performance: 0.70, accessibility: 0.90, 'best-practices': 0.90, seo: 0.90 };
          let failed = false;
          for (const [category, minimum] of Object.entries(thresholds)) {
            const score = scores[category].score;
            console.log(`${category}: ${Math.round(score * 100)}`);
            if (score < minimum) {
              console.error(`${category} is below ${Math.round(minimum * 100)}`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, lighthouse]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize and verify Academy global shell on every HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '2026.08.15.1'
          revision = '2026.08.16.1'
          loader = f'<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v={version}&rev={revision}" data-skunkworks-global-nav="v10"></script>'
          shell_tag = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          pages = []
          fragments = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              html = path.read_text(encoding='utf-8', errors='ignore')
              is_document = bool(re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I))
              if not is_document:
                  fragments.append(path)
                  continue

              html = shell_tag.sub('', html)

              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')

              path.write_text(html, encoding='utf-8')
              pages.append(path)

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              count = html.count('academy-navigation.js')
              if version not in html or revision not in html or 'data-skunkworks-global-nav="v10"' not in html or count == 0:
                  missing.append(str(path))
              if count > 1:
                  duplicate.append(str(path))

          if missing:
              raise SystemExit('Missing current Academy global shell: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate Academy global shell loaders: ' + ', '.join(duplicate))

          print(f'Normalized Academy global shell {version} / revision {revision} / v10 on {len(pages)} HTML document(s).')
          print(f'Skipped {len(fragments)} non-document HTML fragment(s).')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production domain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify CORS-safe shell assets
        run: |
          for attempt in {1..30}; do
            response="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/?shell-rev=2026.08.16.1' || true)"
            shell="$(curl --location --fail --silent --show-error --max-time 20 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1&rev=2026.08.16.1' || true)"
            ui_www="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/skunkworks-ui.js?v=2026.08.15.1&rev=2026.08.16.1' || true)"
            footer_www="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/skunkworks-footer.js?v=2026.08.15.1&rev=2026.08.16.1' || true)"

            if printf '%s' "$response" | grep -qi '<title>Skunkworks Academy' \
              && printf '%s' "$response" | grep -q 'rev=2026.08.16.1' \
              && printf '%s' "$shell" | grep -q 'REVISION = "2026.08.16.1"' \
              && printf '%s' "$shell" | grep -q 'window.location.origin' \
              && ! printf '%s' "$shell" | grep -Eq 'script\.crossOrigin\s*=' \
              && printf '%s' "$ui_www" | grep -q 'Skunkworks Academy Global UI' \
              && printf '%s' "$footer_www" | grep -q 'Skunkworks Academy'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production verification failed: CORS-safe canonical shell assets were not found on the www origin.'
          exit 1
