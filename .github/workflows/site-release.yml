name: Site release

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'docs/accessibility-contrast.md'
      - 'package.json'
      - 'CNAME'
      - '.github/workflows/site-release.yml'
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and audit site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run build, content and WCAG contrast validation
        run: npm run build
      - name: Verify custom domain file
        run: test "$(tr -d '\r\n' < CNAME)" = "skunkworksacademy.com"
      - name: Verify canonical loader is CORS-safe
        run: |
          if grep -Eq 'script\.crossOrigin[[:space:]]*=' assets/academy-navigation.js; then
            echo 'Canonical loader must not force CORS mode on shared classic scripts.'
            exit 1
          fi
          if grep -Eqi 'setAttribute\([^)]*crossorigin' assets/academy-navigation.js; then
            echo 'Canonical loader must not add a crossorigin attribute to shared classic scripts.'
            exit 1
          fi
          grep -q 'isApexAlias' assets/academy-navigation.js
          grep -q 'isLocalPreview' assets/academy-navigation.js
          grep -q 'window.location.origin' assets/academy-navigation.js
          grep -q 'installBrandTheme' assets/academy-navigation.js
          grep -q 'bodyBackground: "theme-owned"' assets/academy-navigation.js

  lighthouse:
    name: Lighthouse local production audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/skw-http.log 2>&1 &
          echo $! > /tmp/skw-http.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-http.log
          exit 1
      - name: Verify Lighthouse uses checked-out shell and accessibility assets
        run: |
          curl --fail --silent http://127.0.0.1:4173/assets/academy-navigation.js | grep -q 'isLocalPreview'
          curl --fail --silent http://127.0.0.1:4173/assets/academy-navigation.js | grep -q 'installBrandTheme'
          curl --fail --silent http://127.0.0.1:4173/assets/academy-brand-theme.css | grep -q 'canonical brand theme'
          curl --fail --silent http://127.0.0.1:4173/assets/skunkworks-ui.js | grep -q 'logo-white.svg'
          curl --fail --silent http://127.0.0.1:4173/assets/skunkworks-accessibility.css | grep -q 'accessibility contrast contract'
      - name: Collect Lighthouse samples
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --output=json \
              --output-path="./lighthouse-report-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet
          done
      - name: Audit rendered light and dark colour contrast
        run: |
          npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/tests/accessibility-contrast.html \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-contrast.json \
            --only-audits=color-contrast \
            --quiet
          node - <<'NODE'
          const report = require('./lighthouse-contrast.json');
          const audit = report.audits['color-contrast'];
          if (!audit || audit.score !== 1) {
            console.error('Rendered WCAG colour-contrast audit failed.');
            for (const item of audit?.details?.items || []) {
              console.error(item.node?.selector || item.node?.snippet || JSON.stringify(item));
            }
            process.exit(1);
          }
          console.log('Rendered light/dark colour-contrast audit passed.');
          NODE
      - name: Assert median Lighthouse scores
        run: node scripts/assert-lighthouse.mjs lighthouse-report-1.json lighthouse-report-2.json lighthouse-report-3.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports-${{ github.run_id }}
          path: |
            lighthouse-report-*.json
            lighthouse-contrast.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy GitHub Pages
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [validate, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Academy site
        uses: actions/checkout@v7

      - name: Checkout canonical course catalog source
        uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/course-catalog
          ref: main
          path: .course-catalog
          persist-credentials: false

      - name: Set up Node.js for course catalog
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build canonical course catalog
        working-directory: .course-catalog
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Mount course-catalog build at /courses
        shell: bash
        run: |
          set -euo pipefail
          build='.course-catalog/build'

          if [[ ! -f "$build/courses.html" && ! -f "$build/courses/index.html" ]]; then
            echo 'Course catalog build did not emit the /courses landing route.'
            find "$build" -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          rm -rf courses courses.html

          if [[ -d "$build/courses" ]]; then
            cp -R "$build/courses" ./courses
          else
            mkdir -p courses
          fi

          if [[ -f "$build/courses.html" ]]; then
            cp "$build/courses.html" ./courses.html
            cp "$build/courses.html" ./courses/index.html
          elif [[ -f "$build/courses/index.html" ]]; then
            cp "$build/courses/index.html" ./courses/index.html
          fi

          for dir in assets img downloads; do
            if [[ -d "$build/$dir" ]]; then
              mkdir -p "$dir"
              cp -R "$build/$dir/." "$dir/"
            fi
          done

          if [[ -f "$build/course-manifest.json" ]]; then
            cp "$build/course-manifest.json" ./course-manifest.json
            cp "$build/course-manifest.json" ./courses/course-manifest.json
          fi

          rm -rf .course-catalog

          test -f courses/index.html
          grep -q 'https://www.skunkworksacademy.com/courses' courses/index.html
          if grep -R -q 'catalog.skunkworksacademy.com' courses courses.html course-manifest.json 2>/dev/null; then
            echo 'Legacy catalogue hostname leaked into the /courses deployment.'
            exit 1
          fi

          echo 'Mounted skunkworks-academy/course-catalog at /courses.'

      - name: Normalize and verify Academy global shell on every HTML document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '2026.08.23.1'
          revision = '2026.08.23.1'
          accessibility_version = '2026.08.16.1'
          loader = f'<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v={version}&rev={revision}" data-skunkworks-global-nav="v10"></script>'
          accessibility = f'<link rel="stylesheet" href="/assets/skunkworks-accessibility.css?v={accessibility_version}" data-skunkworks-accessibility="wcag-contrast" />'
          shell_tag = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          accessibility_tag = re.compile(r'<link\b[^>]*(?:skunkworks-accessibility\.css|data-skunkworks-accessibility)[^>]*>', re.I)
          pages = []
          fragments = []

          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue

              html = path.read_text(encoding='utf-8', errors='ignore')
              is_document = bool(re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I))
              if not is_document:
                  fragments.append(path)
                  continue

              html = shell_tag.sub('', html)
              html = accessibility_tag.sub('', html)

              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {accessibility}\n  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {accessibility}\n  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')

              path.write_text(html, encoding='utf-8')
              pages.append(path)

          missing = []
          duplicate = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              shell_count = html.count('academy-navigation.js')
              accessibility_count = html.count('skunkworks-accessibility.css')
              if version not in html or revision not in html or 'data-skunkworks-global-nav="v10"' not in html or shell_count == 0:
                  missing.append(f'{path} (shell)')
              if accessibility_version not in html or 'data-skunkworks-accessibility="wcag-contrast"' not in html or accessibility_count == 0:
                  missing.append(f'{path} (accessibility)')
              if shell_count > 1:
                  duplicate.append(f'{path} (shell)')
              if accessibility_count > 1:
                  duplicate.append(f'{path} (accessibility)')

          if missing:
              raise SystemExit('Missing current Academy shell/accessibility contract: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate Academy shell/accessibility assets: ' + ', '.join(duplicate))

          print(f'Normalized Academy global shell {version} / revision {revision} / v10 on {len(pages)} HTML document(s).')
          print(f'Normalized WCAG contrast stylesheet {accessibility_version} on {len(pages)} HTML document(s).')
          print(f'Skipped {len(fragments)} non-document HTML fragment(s).')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify production domain
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for production and verify CORS-safe shell assets and /courses
        run: |
          for attempt in {1..30}; do
            response="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/?shell-rev=2026.08.23.1' || true)"
            courses="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/courses' || true)"
            shell="$(curl --location --fail --silent --show-error --max-time 20 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.23.1&rev=2026.08.23.1' || true)"
            theme="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/academy-brand-theme.css?v=2026.08.22.2' || true)"
            ui_www="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/skunkworks-ui.js?v=2026.08.20.1' || true)"
            footer_www="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/skunkworks-footer.js?v=2026.08.20.1' || true)"
            accessibility_www="$(curl --location --fail --silent --show-error --max-time 20 'https://www.skunkworksacademy.com/assets/skunkworks-accessibility.css?v=2026.08.16.1' || true)"

            if printf '%s' "$response" | grep -qi '<title>Skunkworks Academy' \
              && printf '%s' "$response" | grep -q 'rev=2026.08.23.1' \
              && printf '%s' "$response" | grep -q 'data-skunkworks-accessibility="wcag-contrast"' \
              && printf '%s' "$courses" | grep -q 'https://www.skunkworksacademy.com/courses' \
              && printf '%s' "$courses" | grep -Eqi 'Skunkworks Academy Courses|Course Catalog|Learning Formats and Training Delivery' \
              && ! printf '%s' "$courses" | grep -q 'catalog.skunkworksacademy.com' \
              && printf '%s' "$shell" | grep -q 'REVISION = "2026.08.23.1"' \
              && printf '%s' "$shell" | grep -q 'bodyBackground: "theme-owned"' \
              && printf '%s' "$shell" | grep -q 'window.location.origin' \
              && ! printf '%s' "$shell" | grep -Eq 'script\.crossOrigin[[:space:]]*=' \
              && printf '%s' "$theme" | grep -q -- '--sw-skunk-blue: #1e6bd0' \
              && printf '%s' "$theme" | grep -q -- '--sw-signal-orange: #f24208' \
              && printf '%s' "$ui_www" | grep -q 'Skunkworks Academy Global UI' \
              && printf '%s' "$footer_www" | grep -q 'Skunkworks Academy' \
              && printf '%s' "$accessibility_www" | grep -q 'accessibility contrast contract'; then
              echo 'Production verification succeeded, including canonical theme shell and /courses deployment.'
              exit 0
            fi
            sleep 10
          done
          echo 'Production verification failed: canonical theme/shell/accessibility assets or /courses were not found on the www origin.'
          exit 1
