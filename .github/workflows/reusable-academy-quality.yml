name: Reusable Academy quality

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24'
      working-directory:
        type: string
        required: false
        default: '.'
      build-command:
        type: string
        required: false
        default: 'npm run build'
      preview-port:
        type: number
        required: false
        default: 4180
      site-directory:
        type: string
        required: false
        default: '_site'
      accessibility-path:
        type: string
        required: false
        default: '/'

permissions:
  contents: read

jobs:
  academy-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Dependency audit
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            npm audit --audit-level=high --omit=dev
          fi

      - name: Platform contract and CSP mode validation
        shell: bash
        run: |
          test -f academy-platform-contract.json
          test -f scripts/validate-platform-contract.mjs
          test -f scripts/verify-composed-site.mjs
          node scripts/validate-platform-contract.mjs
          test -d "${{ inputs.site-directory }}"
          test -f "${{ inputs.site-directory }}/index.html"
          if grep -R -n 'Content-Security-Policy-Report-Only' . --include='*.html' --exclude-dir=node_modules --exclude-dir=.git; then
            echo 'CSP Report-Only cannot be delivered by meta; use an HTTP response header.'
            exit 1
          fi

      - name: Start local preview
        shell: bash
        run: |
          python3 -m http.server ${{ inputs.preview-port }} --bind 127.0.0.1 --directory "${{ inputs.site-directory }}" > /tmp/academy-reusable-http.log 2>&1 &
          echo $! > /tmp/academy-reusable-http.pid
          for attempt in {1..30}; do
            curl --fail --silent "http://127.0.0.1:${{ inputs.preview-port }}/" >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/academy-reusable-http.log
          exit 1

      - name: Accessibility audit
        shell: bash
        run: |
          npx --yes lighthouse@13.4.1 \
            "http://127.0.0.1:${{ inputs.preview-port }}${{ inputs.accessibility-path }}" \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --only-categories=accessibility \
            --output=json \
            --output-path=/tmp/academy-accessibility.json \
            --quiet
          node - <<'NODE'
          const report = require('/tmp/academy-accessibility.json');
          const score = report.categories?.accessibility?.score ?? 0;
          if (score < 0.9) {
            console.error('Accessibility score below 0.90:', score);
            process.exit(1);
          }
          console.log('Accessibility score:', score);
          NODE

      - name: Local route and asset conformance
        shell: bash
        run: node scripts/verify-composed-site.mjs --base-url "http://127.0.0.1:${{ inputs.preview-port }}/"
