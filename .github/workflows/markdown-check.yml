name: Markdown Check

on:
  push:
    paths:
      - "**/*.md"
      - "course.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "course.yml"

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f README.md
          test -f course.yml
          test -f docs/student-guide.md
          test -f docs/instructor-guide.md
          test -f assessments/quiz.md
          test -f assessments/lab-review-rubric.md

      - name: Basic markdown sanity check
        run: |
          grep -R "CLD-UF-101" README.md docs assessments activities slides
          grep -R "Claude User Fundamentals" README.md docs
