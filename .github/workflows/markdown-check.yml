name: Markdown Check

on:
  push:
    paths:
      - "**/*.md"
      - "course.yml"
      - "package.json"
      - "scripts/**/*.mjs"
      - "self-paced/course-map.yml"
      - "self-paced/**/*.html"
      - "self-paced/**/*.css"
      - "self-paced/**/*.js"
  pull_request:
    paths:
      - "**/*.md"
      - "course.yml"
      - "package.json"
      - "scripts/**/*.mjs"
      - "self-paced/course-map.yml"
      - "self-paced/**/*.html"
      - "self-paced/**/*.css"
      - "self-paced/**/*.js"

jobs:
  markdown-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required instructor-led files
        run: |
          test -f README.md
          test -f course.yml
          test -f docs/student-guide.md
          test -f docs/instructor-guide.md
          test -f assessments/quiz.md
          test -f assessments/lab-review-rubric.md

      - name: Validate required self-paced files
        run: |
          test -f self-paced/README.md
          test -f self-paced/course-map.yml
          test -f self-paced/index.html
          test -f self-paced/reader.html
          test -f self-paced/assets/course.css
          test -f self-paced/assets/course.js
          test -f self-paced/assets/reader.js
          test -f self-paced/modules/module-01-introduction.md
          test -f self-paced/modules/module-02-getting-started.md
          test -f self-paced/modules/module-03-core-use-cases.md
          test -f self-paced/modules/module-04-effective-prompting.md
          test -f self-paced/modules/module-05-documents-files.md
          test -f self-paced/modules/module-06-projects-memory.md
          test -f self-paced/modules/module-07-best-practices-pitfalls.md
          test -f self-paced/modules/module-08-capstone-qa.md
          test -f self-paced/resources/prompt-library.md
          test -f self-paced/resources/learner-workbook.md
          test -f self-paced/resources/verification-checklist.md
          test -f self-paced/assessments/final-knowledge-check.md
          test -f self-paced/assessments/capstone-project.md
          test -f self-paced/lms/implementation-guide.md

      - name: Basic content sanity check
        run: |
          grep -R "CLD-UF-101" README.md docs assessments activities slides self-paced
          grep -R "Claude User Fundamentals" README.md docs self-paced
          grep -R "capstone" self-paced/assessments self-paced/modules

      - name: Run Node course validator
        run: node scripts/validate-self-paced.mjs
