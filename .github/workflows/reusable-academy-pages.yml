name: Reusable Academy Pages deployment

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24'
      build-command:
        type: string
        required: false
        default: 'npm run build'
      artifact-path:
        type: string
        required: false
        default: '_site'
      canonical-url:
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          elif [[ -f package.json ]]; then
            npm install --no-audit --no-fund
          fi

      - name: Build and stage final artifact
        run: ${{ inputs.build-command }}

      - name: Require staged Pages artifact
        shell: bash
        run: |
          test -d "${{ inputs.artifact-path }}"
          test -f "${{ inputs.artifact-path }}/index.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.artifact-path }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Production smoke
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --location --fail --silent --show-error --max-time 20 "${{ inputs.canonical-url }}" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production smoke failed: ${{ inputs.canonical-url }}"
          exit 1
