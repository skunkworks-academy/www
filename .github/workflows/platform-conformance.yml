name: Platform conformance

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/platform-conformance.spec.js'
      - 'academy-platform-contract.json'
      - '.github/workflows/platform-conformance.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install repository and Playwright dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate platform contract
        run: node scripts/validate-platform-contract.mjs

      - name: Start conformance preview
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/skw-conformance-http.log 2>&1 &
          echo $! > /tmp/skw-conformance-http.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4175/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-conformance-http.log
          exit 1

      - name: Run navigation, theme, favicon, canonical, search, auth-state and asset checks
        run: npx playwright test tests/platform-conformance.spec.js --reporter=line
