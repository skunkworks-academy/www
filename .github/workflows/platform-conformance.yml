name: Platform conformance

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/platform-conformance.spec.js'
      - 'academy-platform-contract.json'
      - '.github/workflows/platform-conformance.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Academy site
        uses: actions/checkout@v7

      - name: Checkout canonical course catalog
        uses: actions/checkout@v7
        with:
          repository: skunkworks-academy/course-catalog
          ref: main
          path: .course-catalog
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright test runner
        run: |
          npm install --no-save --no-audit --no-fund --legacy-peer-deps --workspaces=false @playwright/test@1.55.0
          npx playwright install chromium

      - name: Validate platform contract
        run: node scripts/validate-platform-contract.mjs

      - name: Build canonical course catalog
        working-directory: .course-catalog
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Mount catalog through generic subsystem contract
        run: |
          node scripts/mount-subsystem.mjs \
            --source .course-catalog/build \
            --mount courses \
            --landing courses.html \
            --manifest course-manifest.json \
            --asset-dirs assets,img,downloads
          rm -rf .course-catalog

      - name: Stage final composed artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='test-results/' \
            ./ _site/
          node scripts/stamp-platform-contract.mjs academy-platform-contract.json _site/academy-platform-contract.json

      - name: Start conformance preview
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 --directory _site > /tmp/skw-conformance-http.log 2>&1 &
          echo $! > /tmp/skw-conformance-http.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4175/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/skw-conformance-http.log
          exit 1

      - name: Verify composed routes and all same-origin CSS/JS assets
        run: >-
          node scripts/verify-composed-site.mjs
          --base-url http://127.0.0.1:4175/
          --routes /,/courses/,/learn/,/ibm/,/microsoft/,/cisco/,/comptia/,/course-registration/,/forms/,/self-paced/,/slides/

      - name: Run navigation, theme, favicon, canonical, search, auth-state and asset checks
        run: npx playwright test tests/platform-conformance.spec.js --reporter=line
