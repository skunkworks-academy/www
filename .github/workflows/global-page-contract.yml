name: Global page contract

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/academy-navigation.js'
      - 'assets/academy-page-contract.css'
      - 'assets/academy-page-contract.js'
      - 'assets/academy-brand-theme.css'
      - 'assets/academy-theme-conformance.css'
      - 'assets/academy-learn.css'
      - 'assets/academy-forms.css'
      - 'assets/skunkworks-design-system.css'
      - 'images/favicon-black.png'
      - 'images/favicon-white.png'
      - 'scripts/enforce-global-page-contract.mjs'
      - 'scripts/audit-theme-governance.mjs'
      - 'scripts/validate-theme-conformance.mjs'
      - 'scripts/validate-learn-section.mjs'
      - 'THEME_CONFORMANCE.md'
      - 'package.json'
      - '.github/workflows/global-page-contract.yml'
      - '.github/workflows/site-release.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/academy-navigation.js'
      - 'assets/academy-page-contract.css'
      - 'assets/academy-page-contract.js'
      - 'assets/academy-brand-theme.css'
      - 'assets/academy-theme-conformance.css'
      - 'assets/academy-learn.css'
      - 'assets/academy-forms.css'
      - 'assets/skunkworks-design-system.css'
      - 'images/favicon-black.png'
      - 'images/favicon-white.png'
      - 'scripts/enforce-global-page-contract.mjs'
      - 'scripts/audit-theme-governance.mjs'
      - 'scripts/validate-theme-conformance.mjs'
      - 'scripts/validate-learn-section.mjs'
      - 'THEME_CONFORMANCE.md'
      - 'package.json'
      - '.github/workflows/global-page-contract.yml'
      - '.github/workflows/site-release.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-page-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    name: Enforce favicon, brand and colour contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Academy site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify canonical contract assets exist
        shell: bash
        run: |
          set -euo pipefail
          test -s images/favicon-black.png
          test -s images/favicon-white.png
          test -s assets/academy-page-contract.css
          test -s assets/academy-page-contract.js
          test -s assets/academy-brand-theme.css
          test -s assets/academy-theme-conformance.css
          test -s assets/academy-learn.css
          test -s assets/academy-forms.css
          test -s assets/skunkworks-design-system.css
          test -s assets/academy-navigation.js
          test -s scripts/enforce-global-page-contract.mjs
          test -s scripts/audit-theme-governance.mjs

          # The brand theme is the single authored visual contract. Historical
          # CSS entry points remain compatibility shims only.
          grep -q -- '--sw-ink-navy: #03033a' assets/academy-brand-theme.css
          grep -q -- '--sw-skunk-blue: #1e6bd0' assets/academy-brand-theme.css
          grep -q -- '--sw-signal-orange: #f24208' assets/academy-brand-theme.css
          grep -q -- '--sw-off-white: #f7f9fc' assets/academy-brand-theme.css
          grep -q -- '--sw-graphite: #15171a' assets/academy-brand-theme.css
          grep -q -- '--sw-steel-gray: #d8dee8' assets/academy-brand-theme.css
          grep -q -- '--sw-slate-text: #5a6472' assets/academy-brand-theme.css
          grep -q 'data-swa-surface-tone="light"' assets/academy-brand-theme.css
          grep -q 'data-swa-surface-tone="dark"' assets/academy-brand-theme.css
          grep -q 'Academy-wide foundation' assets/academy-brand-theme.css
          grep -q 'body:not(\[data-swa-theme-scope="isolated"\])' assets/academy-brand-theme.css

          grep -q 'compatibility entry point' assets/academy-page-contract.css
          grep -q 'Do not add new rules here' assets/academy-page-contract.css
          grep -q 'compatibility entry point' assets/academy-theme-conformance.css
          grep -q 'Do not add new rules here' assets/academy-theme-conformance.css
          ! grep -q 'background-color: #ffffff !important' assets/academy-navigation.js
          ! grep -q 'html, body.*background-color' assets/academy-page-contract.css

          grep -q 'luminance(background) <= 0.42 ? "dark" : "light"' assets/academy-page-contract.js
          page_contract_version="$(sed -n 's/.*var VERSION = "\([^"]*\)";.*/\1/p' assets/academy-page-contract.js)"
          test -n "$page_contract_version"
          grep -Fq "const VERSION = '$page_contract_version';" scripts/enforce-global-page-contract.mjs
          grep -q 'images/favicon-black.png' assets/academy-page-contract.js
          grep -q 'images/favicon-white.png' assets/academy-page-contract.js

          grep -q -- '--swa-form-surface: #ffffff' assets/academy-forms.css
          grep -q -- '--swa-form-text: #161616' assets/academy-forms.css
          grep -q 'html\[data-theme="dark"\]' assets/academy-forms.css
          grep -q -- '--swa-form-surface: #101010' assets/academy-forms.css
          grep -q -- '--swa-form-text: #ffffff' assets/academy-forms.css
          grep -q 'prefers-color-scheme: dark' assets/academy-forms.css
          grep -q 'grid-template-columns: 1fr !important' assets/academy-forms.css

      - name: Verify shared shell preserves page themes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'installCanonicalFavicons' assets/academy-navigation.js
          grep -q 'installPageContract' assets/academy-navigation.js
          grep -q 'installBrandTheme' assets/academy-navigation.js
          grep -q 'applyDeclaredTheme' assets/academy-navigation.js
          grep -q 'academy-page-contract.css' assets/academy-navigation.js
          grep -q 'academy-page-contract.js' assets/academy-navigation.js
          grep -q 'academy-brand-theme.css' assets/academy-navigation.js
          grep -q 'academy-theme-conformance.css' assets/academy-navigation.js
          grep -q 'VERSION = "2026.08.27.1"' assets/academy-navigation.js
          grep -q 'REVISION = "2026.08.27.1"' assets/academy-navigation.js
          grep -q 'PAGE_CONTRACT_VERSION = "2026.08.27.1"' assets/academy-navigation.js
          grep -q 'BRAND_THEME_VERSION = "2026.08.27.1"' assets/academy-navigation.js
          grep -q 'THEME_CONFORMANCE_VERSION = "2026.08.27.1"' assets/academy-navigation.js
          grep -q 'LEARN_THEME_VERSION = "2026.08.25.1"' assets/academy-navigation.js
          grep -q 'bodyBackground: "theme-owned"' assets/academy-navigation.js
          grep -q 'window.location.origin' assets/academy-navigation.js
          if grep -Eq 'script\.crossOrigin[[:space:]]*=' assets/academy-navigation.js; then
            echo 'Shared shell must remain CORS-safe.'
            exit 1
          fi

      - name: Enforce contract on repository HTML
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/enforce-global-page-contract.mjs --write .
          node scripts/enforce-global-page-contract.mjs --check .
          node scripts/audit-theme-governance.mjs --report "$RUNNER_TEMP/academy-theme-audit.json"

      - name: Verify every forms HTML document uses Academy design and theme assets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          page_contract_version="$(sed -n 's/.*var VERSION = "\([^"]*\)";.*/\1/p' assets/academy-page-contract.js)"
          brand_theme_version="$(sed -n 's/.*var BRAND_THEME_VERSION = "\([^"]*\)";.*/\1/p' assets/academy-navigation.js)"
          theme_conformance_version="$(sed -n 's/.*var THEME_CONFORMANCE_VERSION = "\([^"]*\)";.*/\1/p' assets/academy-navigation.js)"
          mapfile -t forms < <(find forms -maxdepth 1 -type f -name '*.html' -print | sort)
          test "${#forms[@]}" -gt 0
          for file in "${forms[@]}"; do
            grep -q 'data-skunkworks-favicon="canonical"' "$file"
            grep -q 'data-skunkworks-design-system="forms-canonical"' "$file"
            grep -q 'data-skunkworks-forms-style="canonical"' "$file"
            grep -q 'data-skunkworks-global-nav="forms-canonical"' "$file"
            grep -q 'data-skunkworks-brand-theme="canonical"' "$file"
            grep -q 'data-skunkworks-theme-conformance="canonical"' "$file"
            grep -q "academy-page-contract.js?v=${page_contract_version}" "$file"
            grep -q "academy-brand-theme.css?v=${brand_theme_version}" "$file"
            grep -q "academy-theme-conformance.css?v=${theme_conformance_version}" "$file"
          done

      - name: Commit automatic contract repairs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '*.html'; then
            echo 'All HTML documents already satisfy the global page contract.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git commit -m 'Enforce canonical Academy brand and page colour contract'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Publish Academy theme audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: academy-theme-governance-${{ github.run_id }}
          path: ${{ runner.temp }}/academy-theme-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate pull-request HTML without mutating it
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.course-catalog \
            -cf - . | tar -xf - -C "$staging"

          node scripts/enforce-global-page-contract.mjs --write "$staging"
          node scripts/enforce-global-page-contract.mjs --check "$staging"
          node scripts/audit-theme-governance.mjs "$staging" --report "$RUNNER_TEMP/academy-theme-audit.json"

          mapfile -t forms < <(find "$staging/forms" -maxdepth 1 -type f -name '*.html' -print | sort)
          for file in "${forms[@]}"; do
            grep -q 'data-skunkworks-design-system="forms-canonical"' "$file"
            grep -q 'data-skunkworks-forms-style="canonical"' "$file"
            grep -q 'data-skunkworks-global-nav="forms-canonical"' "$file"
            grep -q 'data-skunkworks-brand-theme="canonical"' "$file"
            grep -q 'data-skunkworks-theme-conformance="canonical"' "$file"
          done

          echo 'Pull-request documents are normalizable to the canonical Academy-wide theme and contrast contracts.'

  production-assets:
    name: Verify canonical production assets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: enforce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public favicon and contract assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.skunkworksacademy.com'
          curl --location --fail --silent --show-error --max-time 20 "$base/images/favicon-black.png" >/dev/null
          curl --location --fail --silent --show-error --max-time 20 "$base/images/favicon-white.png" >/dev/null
          curl --location --fail --silent --show-error --max-time 20 "$base/assets/academy-page-contract.css?v=2026.08.27.1" | grep -q 'compatibility entry point'
          curl --location --fail --silent --show-error --max-time 20 "$base/assets/academy-page-contract.js?v=2026.08.27.1" | grep -q 'SKUNKWORKS_ACADEMY_PAGE_CONTRACT'
          curl --location --fail --silent --show-error --max-time 20 "$base/assets/academy-brand-theme.css?v=2026.08.27.1" | grep -q 'single authored source'
          curl --location --fail --silent --show-error --max-time 20 "$base/assets/academy-theme-conformance.css?v=2026.08.27.1" | grep -q 'compatibility entry point'
          curl --location --fail --silent --show-error --max-time 20 "$base/assets/academy-forms.css?v=2026.08.20.1" | grep -q 'Skunkworks Academy forms and document surface contract'
