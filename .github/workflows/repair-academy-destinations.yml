name: Repair Academy destinations

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-academy-destinations.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Standardise destination pages
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('plans-and-purchases/index.html'),
              Path('google/index.html'),
              Path('comptia/index.html'),
              Path('cisco/index.html'),
          ]
          loader = '<script defer src="https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.07.17.4" data-skunkworks-global-nav="v7"></script>'
          sitemap = '<link rel="sitemap" type="text/html" title="Skunkworks Academy Site Map" href="https://skunkworksacademy.com/#site-tree" data-skunkworks-site-map="v2" />'
          favicon_light = '<link rel="icon" type="image/png" href="https://skunkworksacademy.com/images/favicon-black.png" media="(prefers-color-scheme: light)" />'
          favicon_dark = '<link rel="icon" type="image/png" href="https://skunkworksacademy.com/images/favicon-white.png" media="(prefers-color-scheme: dark)" />'

          for path in targets:
              if not path.exists():
                  raise SystemExit(f'Missing destination entry point: {path}')
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://raw.githubusercontent.com/skunkworks-academy/.github/refs/heads/main/images/favicon-black.png', 'https://skunkworksacademy.com/images/favicon-black.png')
              text = text.replace('https://raw.githubusercontent.com/skunkworks-academy/.github/refs/heads/main/images/favicon-white.png', 'https://skunkworksacademy.com/images/favicon-white.png')
              text = text.replace('https://github.com/skunkworksza/www/blob/main/assets/skunkworks/logo-skunkworks-trans%2040%20%C3%97%2040%20px.png?raw=true', 'https://skunkworksacademy.com/images/favicon-black.png')
              if 'data-skunkworks-global-nav="v7"' not in text:
                  text = text.replace('</head>', f'  {sitemap}\n  {favicon_light}\n  {favicon_dark}\n  {loader}\n</head>', 1)
              else:
                  text = text.replace('academy-navigation.js?v=2026.07.04', 'academy-navigation.js?v=2026.07.17.4')
                  text = text.replace('academy-navigation.js?v=2026.07.06.2', 'academy-navigation.js?v=2026.07.17.4')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate canonical navigation
        run: |
          for page in plans-and-purchases/index.html google/index.html comptia/index.html cisco/index.html; do
            grep -q 'data-skunkworks-global-nav="v7"' "$page"
            grep -q 'https://skunkworksacademy.com/images/favicon-black.png' "$page"
            grep -q 'https://skunkworksacademy.com/images/favicon-white.png' "$page"
            grep -q 'data-skunkworks-site-map="v2"' "$page"
            ! grep -q 'skunkworks-academy/.github/refs/heads/main/images' "$page"
          done
      - name: Commit repaired destinations
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add plans-and-purchases/index.html google/index.html comptia/index.html cisco/index.html
          git commit -m 'fix: align destination headers with Academy home navigation'
          git push
