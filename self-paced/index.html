  <style>
    header.top[data-fallback-header="true"] {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--sk-border, rgba(148, 163, 184, .22));
      background: color-mix(in srgb, var(--sk-bg, #050505) 92%, transparent);
      backdrop-filter: blur(18px);
    }

    header.top[data-fallback-header="true"] .shell.nav {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    header.top[data-fallback-header="true"] .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--sk-text, currentColor);
      text-decoration: none;
      font-weight: 900;
      letter-spacing: -.02em;
      white-space: nowrap;
    }

    header.top[data-fallback-header="true"] .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    header.top[data-fallback-header="true"] .logo-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      header.top[data-fallback-header="true"] .logo-light { display: none; }
      header.top[data-fallback-header="true"] .logo-dark { display: inline-block; }
    }

    header.top[data-fallback-header="true"] nav.links[aria-label="Primary pricing navigation"] {
      display: flex !important;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    header.top[data-fallback-header="true"] nav.links[aria-label="Primary pricing navigation"] a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 1px solid var(--sk-border, rgba(148, 163, 184, .26));
      border-radius: 999px;
      padding: 10px 14px;
      color: var(--sk-muted, #64748b);
      background: rgba(255, 255, 255, .035);
      text-decoration: none;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    header.top[data-fallback-header="true"] nav.links[aria-label="Primary pricing navigation"] a:hover,
    header.top[data-fallback-header="true"] nav.links[aria-label="Primary pricing navigation"] a[aria-current="page"] {
      color: var(--sk-text, currentColor);
      border-color: color-mix(in srgb, var(--sk-text, currentColor) 42%, transparent);
    }

    .sk-hero__badges,
    .sk-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 1.25rem;
    }

    .sk-pill {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      border: 1px solid var(--sk-border, rgba(148, 163, 184, .24));
      border-radius: 999px;
      padding: .55rem .85rem;
      color: var(--sk-muted, #64748b);
      background: rgba(255, 255, 255, .04);
      font-size: .9rem;
      font-weight: 700;
    }

    .sk-feature-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .sk-mini-card {
      border: 1px solid var(--sk-border, rgba(148, 163, 184, .24));
      border-radius: 1.25rem;
      padding: 1rem;
      background: rgba(255, 255, 255, .04);
    }

    .sk-mini-card strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .sk-mini-card span {
      display: block;
      margin-top: .35rem;
      color: var(--sk-muted, #64748b);
      font-size: .9rem;
    }

    .sk-plan-snapshot {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .sk-plan-card {
      border: 1px solid var(--sk-border, rgba(148, 163, 184, .24));
      border-radius: 1.5rem;
      padding: 1.25rem;
      background: rgba(255, 255, 255, .045);
      display: flex;
      flex-direction: column;
      gap: .85rem;
      min-height: 100%;
    }

    .sk-plan-card--highlight {
      border-color: #7c3aed;
      box-shadow: 0 24px 60px rgba(124, 58, 237, .18);
    }

    .sk-plan-card h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .sk-price {
      margin: 0;
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .sk-price small {
      color: var(--sk-muted, #64748b);
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    .sk-plan-card ul {
      padding-left: 1.1rem;
      margin: 0;
      color: var(--sk-muted, #64748b);
    }

    .sk-notice {
      border: 1px solid rgba(14, 165, 233, .35);
      border-radius: 1.25rem;
      padding: 1rem;
      background: rgba(14, 165, 233, .08);
      color: var(--sk-muted, #64748b);
    }

    @media (max-width: 1100px) {
      .sk-feature-strip,
      .sk-plan-snapshot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      header.top[data-fallback-header="true"] .shell.nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 0;
      }

      header.top[data-fallback-header="true"] nav.links[aria-label="Primary pricing navigation"] {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 8px;
        scrollbar-width: thin;
      }
    }

    @media (max-width: 720px) {
      .sk-feature-strip,
      .sk-plan-snapshot { grid-template-columns: 1fr; }
    }
